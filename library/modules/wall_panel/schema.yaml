# Framed wall panel: studs at a fixed spacing between a bottom plate and the
# lower top plate, plus the build-up's workshop layers (the upper top plate
# is fitted on site along the wall line). Variants per system choose
# the sizes and the build-up.
#
# Datum: exterior face (face A), bottom-left seen from outside; x along the run,
# y into the wall, z up. Lengths are in the system's units.

id: wall_panel
title: Wall panel

parameters:
  width:
    type: length
    min: 600
    max: 3600
    description: Panel length along the run.
  height:
    type: length
    min: 2100
    max: 3000
    description: >-
      Overall height, bottom of the bottom plate to top of the upper top
      plate (fitted on site; the panel's framing stops one plate lower).
  spacing:
    type: length
    min: 300
    max: 600
    description: Stud spacing, centre to centre.
  stud:
    type: lumber
    description: Lumber for studs and plates (catalog id).
  buildup:
    type: buildup
    description: Build-up (system build-up id); its workshop layers become parts.

# Ports. The compiler computes each port's frame from the parameters: origin,
# normal (out of the wall), along (the axis shared with the connected port: up
# at the ends, the run at the bottom) and across (the third axis in the port's
# face: into the wall's depth). The schema declares what the port is for.
# kind: how a connection is positioned on the port (fixed: one position).
# roles: the interface roles the port can fill, as interface.role.
# The compiler also maps the names each port exposes to its parts; the
# interface roles say which names a port that fills them must expose.
ports:
  left:
    description: The panel's left end, seen from outside.
    kind: fixed
    roles: [wall_inline.b, wall_corner.through, wall_corner.butt]
  right:
    description: The panel's right end, seen from outside.
    kind: fixed
    roles: [wall_inline.a, wall_corner.through, wall_corner.butt]
